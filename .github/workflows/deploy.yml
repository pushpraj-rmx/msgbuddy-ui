name: Deploy

# Auto-deploy the Next.js UI on every push to `production`.
# Runs on a SELF-HOSTED runner on the VPS itself (no inbound SSH needed) and
# executes the deploy locally in the existing checkout. Because `pm2 reload` is
# the LAST step under `set -e`, any failure in install/build aborts BEFORE the
# reload — a broken commit is a failed deploy, never a downed site.

on:
  push:
    branches: [production]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vps]
    steps:
      - name: Deploy (build + reload) on the VPS
        run: |
          set -euo pipefail

          # Non-interactive shell has Node 18 + no pnpm — load nvm (Node 20 + corepack pnpm).
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"

          # Use the passphrase-less read-only deploy key for git (leaves the
          # interactive, passphrase-protected id_ed25519 untouched).
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/msgbuddy_ui_github -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          cd ${{ vars.DEPLOY_PATH }}

          git fetch origin
          git checkout production
          git reset --hard origin/production

          pnpm install --no-frozen-lockfile

          # Lint is advisory — report but never block the deploy.
          pnpm lint || echo "::warning::lint reported issues (non-blocking)"

          # Build is mandatory — set -e aborts the deploy here on failure.
          pnpm build

          # Restart only after everything above succeeded.
          pm2 reload ${{ vars.PM2_NAME }} --update-env
          pm2 save
